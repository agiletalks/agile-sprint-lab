name: Projection checks
on:
  push:
    paths: ['projection/**', 'package.json', 'package-lock.json', '.github/workflows/projection.yml']
  pull_request:
    paths: ['projection/**', 'package.json', 'package-lock.json', '.github/workflows/projection.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agile-sprint-lab-projection
          path: |
            projection/dist/Agile-Sprint-Lab-Projection.html
            projection/screenshots/
            projection/reports/
