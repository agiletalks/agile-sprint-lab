name: Projection checks
on:
  push:
    paths: ['projection/**', 'package.json', 'package-lock.json', '.github/workflows/projection.yml']
  pull_request:
    paths: ['projection/**', 'package.json', 'package-lock.json', '.github/workflows/projection.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Start local test server
        run: npm run dev > /tmp/projection-server.log 2>&1 &
      - name: Wait for server
        run: node -e "for(let i=0;i<50;i++){try{if((await fetch('http://127.0.0.1:4173/healthz')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,200))}process.exit(1)" --input-type=module
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agile-sprint-lab-projection
          path: |
            projection/dist/Agile-Sprint-Lab-Projection.html
            projection/screenshots/
