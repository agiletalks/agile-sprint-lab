in-top:25px}.confirm-row button{flex:1}.photo-picker{width:100%}.lightbox img{max-height:none}.lightbox figcaption{font-size:12px;text-align:center;color:#d2e1d2}.empty-gallery h2{font-family:Georgia;font-size:28px;font-weight:normal}.timer-urgent{color:#a36545}.projection .outcome{align-items:center}.topbar button{font-size:11px}.sidebar-foot button{margin-left:auto;color:#b8cbbf}.modal-backdrop label{display:block;font-size:12px;margin:15px 0}.file-label:focus-within,.photo-picker:focus-within{outline:2px solid #245e56;outline-offset:3px}input[type=checkbox]{width:auto}.backup-note{font-size:11px;line-height:1.8;color:#8c967f}.print-sheet{font:12pt/1.65 Georgia,serif;padding:25mm}.print-sheet h1{font-size:24pt}.print-sheet h2{font-size:18pt;break-before:page}.print-sheet .cue{font:10pt/1.6 Arial;color:#666}.poster-info h3{overflow-wrap:anywhere}.projection .nav-controls{display:flex;gap:10px}.focus-outline:focus{outline:3px solid #a8bd90}.script-heading button{font-size:10px}.projection .strength-grid{gap:12px}.topbar .connection{display:none}@media(max-width:600px){.topbar{padding:15px}.local-message{margin:14px}.projection .poster-grid{grid-template-columns:1fr}.gallery-toolbar{gap:7px}.gallery-toolbar>*{font-size:10px}.local-tools{margin-top:8px}.timer-value{font-size:60px}.workspace{padding:15px}.local-tag{font-size:8px}.topbar>div{flex-wrap:wrap}.sidebar{padding-bottom:5px}.sidebar nav{max-width:100%}.sidebar .session-label{display:none}#notice{left:15px;right:15px;bottom:15px}}@media print{.app-shell,.projection,#modal,#notice{display:none!important}.full-script{display:block!important;padding:12mm;font:12pt/1.65 Georgia,serif}.full-script h1{font-size:24pt}.full-script h2{font-size:18pt;break-before:page}.full-script p{margin:0 0 12pt}.full-script .cue{font:10pt/1.6 Arial;color:#666}}
</style></head><body><div id="app"></div><div id="notice" role="status" aria-live="polite"></div><div id="modal"></div><script id="workshop-content" type="application/json">{"stages":[{"title":"Welcome to the lab","label":"Welcome & purpose","phase":"Opening","minutes":7,"zh":"介紹你自己、全日版與本次的差異；先說明語言約定。","lead":"Real challenges. Useful solutions. Better collaboration.","steps":["Explore practical elements from the Agile world.","Work in teams of four or five.","Use language that includes everyone in your team. Help each other share in English."],"result":"Bring your experience, questions, and curiosity.","materials":"Projector · introduction cards"},{"title":"Meet your teammates","label":"Skills marketplace","phase":"Opening","minutes":12,"zh":"先寫介紹卡，再走動認識至少三人，最後組成四至五人團隊。","lead":"Find different strengths and a shared way to communicate.","steps":["Write your introduction card.","Meet at least three people before choosing a team.","Form a team of four or five. Check that everyone can join the discussion."],"result":"A team that can collaborate and share its key ideas in English.","materials":"Introduction cards · markers"},{"title":"Agree how to work together","label":"Roles & agreements","phase":"Opening","minutes":5,"zh":"選 facilitator、記錄及溝通責任，訂二至三個約定。","lead":"Make room for every voice.","steps":["Choose a team facilitator to support participation and time.","Agree who captures ideas and helps share the results.","Write two or three working agreements, including your language agreement."],"result":"Visible agreements everyone can support.","materials":"Role token · paper · markers"},{"title":"Write your challenge","label":"Challenge cards","phase":"Diverging","minutes":9,"zh":"先說明 DoR 與 AC，再給三分鐘安靜書寫，最後檢查卡片。","lead":"What challenge do you face in your facilitation work in the age of AI?","steps":["When I am…","The challenge I face is…","This affects my work by…","On the back: what would make today’s solution useful to me?"],"result":"One clear challenge and one or two acceptance criteria per person.","materials":"Challenge cards · pens"},{"title":"Share and clarify","label":"Understand challenges","phase":"Organizing","minutes":14,"zh":"每人最多兩分鐘分享正反面，先理解，再選題。","lead":"Understand each person’s experience before choosing.","steps":["Give each person up to two minutes to share their challenge and acceptance criteria.","Listen, then ask questions to clarify.","Check the context, impact, and scope together."],"result":"Challenges your team understands well enough to choose.","materials":"Challenge cards"},{"title":"What done looks like","label":"Definition of Done","phase":"Converging","minutes":3,"zh":"選題前講清楚 DoD。一個完成挑戰對應一張海報。","lead":"Make your solution useful and visible.","steps":["Show the challenge and its acceptance criteria.","Capture a practical solution on one poster.","Explain how the solution meets the acceptance criteria.","Make the poster clear enough for other teams to read."],"result":"A shared understanding of a completed poster.","materials":"Poster paper · thick markers"},{"title":"Choose where to start","label":"Map & prioritize","phase":"Converging","minutes":8,"zh":"實體红绿点投票；紅點可多題、綠點每人一票。","lead":"Use the dots to start a conversation about priorities.","steps":["R · Red: I have experienced this too. One per relevant challenge.","G · Green: I want us to work on this first. One vote per person.","Count and plot the cards. Discuss scope and acceptance criteria.","Choose your first challenge and a possible order for the rest."],"result":"A first challenge your team agrees to tackle.","materials":"Paper matrix · red R and green G dots"},{"title":"Plan your first challenge","label":"Goal & approach","phase":"Converging","minutes":5,"zh":"Why、What、How；針對此題交換經驗、工具與例子。","lead":"Agree on your result and how you will create it.","steps":["Why · What useful result do we want?","What · What will we put on the poster?","How · How will we work and use our time?"],"result":"A short, shared approach for the selected challenge.","materials":"Selected challenge card · poster paper"},{"title":"One challenge at a time","label":"Team collaboration","phase":"Converging","minutes":27,"zh":"各隊自己循環。剩十／三分鐘提醒；先完成再選下一題。","lead":"Finish a challenge. Capture its solution. Then choose the next.","steps":["Choose → Plan → Solve → Capture → Check","When the solution meets its acceptance criteria, finish its poster.","If time remains, choose the next challenge and repeat.","Each completed challenge gets its own poster. Uploading can happen separately."],"result":"One or more completed posters at your team’s own pace.","materials":"Challenge cards · multiple poster sheets"},{"title":"Prepare your posters","label":"Capture & display","phase":"Closing","minutes":5,"zh":"檢查海報並標示隊號；把照片交給主持人，在這台電腦匯入。","lead":"Help other teams understand your work.","steps":["Check the challenge, acceptance criteria, and solution are visible.","Write your team number on every poster.","Bring poster photos to the host device for local import. No website or login is needed.","Display physical posters. Label unfinished work clearly."],"result":"Readable posters ready for the gallery walk.","materials":"Tape · poster photos on the host device"},{"title":"Explore the gallery","label":"Gallery walk","phase":"Closing","minutes":15,"zh":"兩輪各五分鐘，換留守者，最後三分鐘回隊檢視回饋。","lead":"Look, ask, and leave useful feedback.","steps":["One teammate stays with your posters; the others visit.","Switch after five minutes so everyone can explore.","What is useful here? What question or suggestion could help?","Return to your team and consider what to improve or test next."],"result":"Feedback to help teams develop their solutions.","materials":"Physical posters · feedback sticky notes"},{"title":"Reflect on your collaboration","label":"Retro & feedback","phase":"Closing","minutes":7,"zh":"先個人想，再隊內 retro，最後貼給你的回饋及帶回的一招。","lead":"What will you keep, and what will you change?","steps":["What helped us work well together?","What would we change next time?","Leave one message for the workshop facilitator.","Name one practice you will take away and where you will try it."],"result":"One team improvement and one personal next step.","materials":"Two sticky notes per person · feedback wall"},{"title":"Take it into your next session","label":"Closing","phase":"Closing","minutes":3,"zh":"回顧敏捷元素；邀請少量簡短分享，準時結束。","lead":"Choose one practice to try in your own work.","steps":["You formed teams and made your working needs visible.","You clarified, prioritized, and completed challenges.","You reviewed results and reflected on collaboration.","Where could one of these practices help in your next session?"],"result":"Thank you for your ideas and support for each other.","materials":"Takeaway notes"}],"strengths":["I listen carefully.","I ask questions that help people think.","I bring new ideas.","I help organize ideas.","I explain things clearly.","I connect ideas and spot patterns.","I help turn ideas into practical steps.","I notice details we might miss.","I help people find common ground.","I encourage quieter people to take part.","I help the team stay focused.","I help the team manage its time.","I capture discussions through notes or drawings.","I help people communicate across languages."],"initialState":{"stage":0,"slide":0,"running":false,"end":null,"remaining":420,"started":null,"teamCount":8,"hostName":"Percy Hsu","showChinese":false,"gallery":false},"scripts":["00-07\n\n[Display the workshop title. Welcome participants.]\n\nHello, everyone. My name is [your name], and I am an Agile Coach. Thank you for joining me today.\n\nIn this workshop, I will share some practical elements from the Agile world that I have found useful in my work. Each element serves a purpose. Together, they help a team understand challenges, choose what to work on, and create useful results.\n\nI originally designed this as a full day workshop, where a large group works together as one team. For this conference, I have adapted it to our 120 minute timebox. A timebox means a fixed amount of time.\n\nToday, you will work in teams of four or five. Most of your discussion will happen within your team. Later, you will explore the other teams' work.\n\nOur topic is the challenges we face as facilitators, consultants, and coaches in the age of AI. Think back a few years. Did you expect AI to become part of your work in the way it has today?\n\n[Pause for reflection. Take at most two short responses if time allows.]\n\nAI can help us, and it can also change the challenges we face. Today, you will bring one challenge from your own experience and explore it with your team.\n\nWe will move through five stages: opening, diverging, organizing, converging, and closing. As we go, I will explain the Agile elements behind the activities.\n\nYou will experience the workshop as participants and reflect on it as facilitators. Pay attention to how each activity helps your team work together.\n\nBefore we form teams, let us agree on language. I want everyone to feel comfortable taking part. Within your team, you may use the language or languages that work for you. Please check that everyone can understand and join the discussion.\n\nWhen we share with other teams or with the whole room, we will use English as our common language. Help each other prepare and explain your ideas. Simple English is enough. Your team needs a way to share in English; you can support each other with translation.","07-19\n\n[Distribute introduction cards. Display the four fields and the strength examples in Appendix A. Use the first three minutes for instructions and writing, the next five for meeting people, and the final four for settling into teams, checking language arrangements, and explaining self-selection.]\n\nWe will begin with a skills marketplace. This is a chance to meet people and introduce what you can bring to a team.\n\nPlease fill in four things on your card: what you would like us to call you, one or two strengths you bring, the languages you can work in, and the language you prefer for discussion.\n\nYour contribution could be listening, asking useful questions, organizing ideas, or explaining things clearly. Choose something that feels natural to you. The slide gives you more examples.\n\nWrite clearly so other people can read your card. You have two minutes.\n\n[Start the timer. When writing time ends, invite movement. Offer a seated option for anyone who needs it.]\n\nNow, move around and introduce yourself. Please meet at least three people before settling into a team. If possible, meet someone you do not already know.\n\nLook for different strengths. Also, talk about the languages you can use together. We have five minutes for meeting people, followed by four minutes to finish forming teams.\n\n[Announce the final four minutes.]\n\nPlease form a team of four or five and find a place to work. Check that everyone can join your discussion and that your team has a way to share key points in English. Agree on any translation support together.\n\nIf you need help finding a team, please let me know.\n\n[Help participants find a group. For uneven numbers, adjust group sizes so nobody is excluded.]\n\nYou have just experienced self-selection. You chose your teammates within a few shared conditions. This gives you a part in shaping your team and a responsibility to help it work well.","19-24\n\n[Use the first two minutes to explain and choose roles. Use the remaining three minutes to introduce and agree on working agreements. Give the team facilitator a visible token or marker.]\n\nPlease choose one person to be your team facilitator. This person will help the team stay within the time, hear every voice, and check that completed work meets our agreed conditions.\n\nThe token helps us recognize that role. The facilitator may also contribute ideas. Their responsibility is to support the team's process.\n\nAlso, agree on who will capture your discussion and who will help the team communicate its results. You can share or change these responsibilities.\n\nNext, agree on two or three ways you want to work together today. Ask: what do we need from each other to work well?\n\nYou might agree to hear from everyone, ask when something is unclear, and help each other stay focused. Include your language agreement so everyone can take part.\n\nWrite your agreements where you can see them. Check that everyone can support them.\n\n[At the end, check that each team has a facilitator and visible agreements.]","24-33\n\n[Show the challenge card. Use three minutes for explanation, three for individual writing, and three for each person to check and improve their own card.]\n\nNow, each person will write one challenge from their work as a facilitator, consultant, or coach in the age of AI.\n\nOn the front, complete three sentences:\n\nWhen I am...\nThe challenge I face is...\nThis affects my work by...\n\nDescribe a situation you have experienced. Keep it specific enough for your team to understand and work on today.\n\nOn the back, write what you hope to receive from today's discussion. What would make a solution useful to you? Write one or two clear conditions. We call these acceptance criteria.\n\nFor example, you might need a short checklist for reviewing an AI-generated workshop agenda, with questions that help you spot missing information. The acceptance criteria help the team understand what a useful response should contain.\n\nWe will also use a Definition of Ready. For this workshop, a challenge is ready when its situation, challenge, and impact are clear, its acceptance criteria are understandable, and the team can make useful progress within today's time.\n\nDefinition of Ready is a practice some Agile teams use. Here, it helps us start with a shared understanding.\n\nPlease write quietly on your own first. This gives every person space to express their experience before the group discussion. You have three minutes.\n\n[Ask team facilitators to support quiet writing. After three minutes, allow three minutes for checking and clarifying individual cards.]\n\nRead your card again. Could someone else understand it? Are your acceptance criteria something the team can address today? You may ask for help if a phrase is unclear.","33-47\n\n[Each participant has up to two minutes to explain the front and back of their card. Use the remaining time for clarifying questions.]\n\nPlease take turns sharing your challenge and acceptance criteria. Give each person up to two minutes. Listen first, then ask questions to understand.\n\nAt this point, help each other clarify the challenges. We will choose what to work on in the next step.\n\nThe person who brought the challenge can explain the context and improve the wording. Keep the focus on the situation, its effect, and what a useful result would look like.\n\nTeam facilitators, please make sure everyone has a turn. Before moving on, check that your team understands each card well enough to choose.\n\n[Circulate. Help teams narrow challenges that are too broad.]\n\nYou have been making the challenges clearer. This has a connection to refinement in Agile work: we add useful detail so people can understand the work and make decisions about it.","47-50\n\n[Display the completion checklist before teams prioritize.]\n\nBefore you choose a challenge, let us agree on what completed work should look like. In Scrum, the Definition of Done gives people a shared understanding of the quality expected in completed work. We are adapting that idea for today's workshop.\n\nFor each challenge you complete, create one poster. It must show the challenge, its acceptance criteria, and your team's solution. Write clearly and make it large enough for other people to read.\n\nCheck that your solution addresses the acceptance criteria. Show how it meets them. If it does not meet them yet, keep working on that challenge.\n\nYour solution might be an approach, a checklist, a set of steps, or a practical response to the situation. Make it specific enough for the person who brought the challenge to use or try.\n\nWhen the solution is complete and captured on its poster, your team may choose the next challenge. Work on one challenge at a time and repeat this process while time remains.\n\nWe will photograph completed posters for sharing. In this offline version, bring the photo files to the host device. The host can import them into our local gallery. We will use the physical posters for our gallery walk.\n\n[Local workshop Definition of Done: the poster identifies the challenge and acceptance criteria; presents a usable solution; explains how it meets the criteria; and is readable for other teams. Photograph and local import are documentation steps.]","50-58\n\n[Give each team a matrix with red-dot count on the horizontal axis and green-dot count on the vertical axis. Label counts from zero to five. Provide red and green dots marked R and G so color is not the only cue.]\n\nWe will use two types of dots to help your team decide where to start.\n\nA red dot means: I have experienced this challenge too. You may place one red dot on each challenge you have personally experienced, including your own.\n\nA green dot means: I want our team to work on this challenge today. Each person has one green dot. Use it to show your first choice.\n\nPlease vote quietly first. Then count the dots on each card.\n\nOn your matrix, more red dots move a challenge further to the right. More green dots move it higher. Place cards at the matching counts. If cards have the same counts, place them beside each other.\n\nLook at the pattern together. Which challenges are shared? Which ones do people want to work on? Check the scope and acceptance criteria as well.\n\nThe dots help you have a discussion and choose. Agree on your first challenge and a possible order for the remaining challenges. If there is a tie, ask which challenge you can make useful progress on within the time available.\n\n[Within this eight-minute block, use about two minutes for instructions, one to vote, two to plot, and three to discuss and choose.]\n\nKeep the remaining cards visible. Once you finish your first challenge, return to them and choose the next one. You may change the order if your team learns something new.","58-63\n\n[Ask teams to make a short plan for the selected challenge.]\n\nBefore you start, agree on what you want to achieve and how you will work.\n\nFirst, what useful result do you want for this challenge? Second, what will you put on the poster? Third, how will you use your time to create it?\n\nThese questions connect to the purpose of Sprint Planning: understanding why the work matters, what to do, and how to do it.\n\nThe person who brought the challenge can explain the experience in more detail. Other people may bring a related experience, a tool, an example, or useful questions.\n\nThis is different from your introduction card. Earlier, you shared your general strengths. Now, consider what you can contribute to this particular challenge.\n\nAgree on who will help capture the solution. Your facilitator will help the team hear each person and check progress. You have five minutes to prepare your first approach.","63-90\n\n[Start a visible 27-minute timer. Display the repeated sequence: choose, plan, solve, capture, check, choose next. Circulate without taking over team decisions. Teams may take a brief stretch as needed within this timebox.]\n\nYou now have 27 minutes to work together.\n\nWork on your selected challenge. Develop a solution that meets its acceptance criteria, capture it on one poster, and check the Definition of Done.\n\nOnce that challenge is complete, look at the time remaining. If there is enough time, choose your next challenge, make a short plan, and repeat.\n\nYour team may complete more than one poster. Each poster represents one completed challenge. The number of posters will depend on the challenges you choose and the time you need.\n\nTeam facilitators, help everyone contribute. Keep the acceptance criteria visible and check whether the discussion is moving toward a useful result.\n\n[At minute 80, announce ten minutes remaining.]\n\nYou have ten minutes left. Check where you are against your acceptance criteria. Decide how to use the remaining time.\n\n[At minute 87, announce three minutes remaining.]\n\nYou have three minutes left. Please focus on completing and capturing the challenge you are working on. If it will remain unfinished, make its current status clear.\n\n[Useful prompts while circulating: What does the challenge owner need? Which acceptance criterion are you addressing? What would make this usable? Who has a different view? What still needs to be completed?]","90-95\n\n[Allow five minutes for checking, display, and photographs. Avoid introducing a new challenge.]\n\nOur main work period has ended. Please use these five minutes to check your posters and prepare them for others to see.\n\nKeep the challenge, acceptance criteria, and solution visible together. Check the writing and mark each poster with your team name or number.\n\nDisplay every completed poster. If a challenge is unfinished, label it clearly as work in progress so visitors understand its status.\n\nTake a clear photo of each completed poster. Bring the photo files to the host device, where they can be imported into the local gallery. Keep the physical posters displayed.\n\nYou can begin your next challenge once its solution is complete and captured on the poster. You do not need to wait for the photo import.\n\nChoose one person to stay with your posters for the first part of the gallery walk. You will switch halfway through so everyone can visit other teams.","95-110\n\n[Use two minutes for instructions, five for the first visit period, five for the second, and three for teams to return and consider feedback. Supply sticky notes.]\n\nWe will now have a gallery walk. Visit the other teams and explore their posters.\n\nLook at the original challenge, the acceptance criteria, and the solution. Ask questions to understand their thinking.\n\nLeave a short note: what is useful here, or what question or suggestion could help improve it? Keep your feedback clear and respectful.\n\nPlease use simple English when communicating across teams. You can help each other explain or translate. Shared feedback notes should be understandable to the receiving team, with a short English version where needed.\n\nOne person from each team will stay with the posters for the first five minutes. Then we will switch, so that person also has time to visit other teams.\n\n[After the first five-minute visit period, announce the switch. After the second, ask everyone to return to their own team.]\n\nPlease return to your team and read the feedback. What did other people notice? Is there anything you want to clarify, improve, or test next? You have three minutes to discuss.\n\nThis connects to review in Agile work. We make results visible, inspect them together, and use what we learn to decide what to do next.","110-117\n\n[Include the short instructions within the seven-minute block. Use about one minute for individual reflection, three for team discussion, and three for writing and posting personal feedback.]\n\nNow, let us reflect on how your team worked together.\n\nTake one quiet minute to think about two questions: what helped us work well together, and what would we change next time?\n\nThen share your thoughts with your team. Choose one change you would try the next time you work together.\n\n[After the team discussion, distribute two sticky notes per participant.]\n\nPlease write two short notes for our feedback wall.\n\nOn the first, write one message for me about this workshop. What helped you, or what could I improve?\n\nOn the second, write one practice you will take into your own work and where you would like to try it.\n\nPost them in the matching sections of the wall. You may use a language you are comfortable with. A short English translation is welcome if you can add one.","117-120\n\n[Invite at most two brief takeaways if time allows.]\n\nToday, you formed your own teams, made your language needs visible, and agreed on how to work together.\n\nYou made challenges clear, chose where to start, agreed on what completed work should look like, and created solutions one challenge at a time.\n\nYou also reviewed other teams' work and reflected on your own collaboration.\n\nThese activities show how selected Agile elements can support a workshop. Each element has a purpose, and you can adapt it to the people and situation you are working with.\n\nAs you leave, choose one practice you would like to try. Where could it help in your next session?\n\nThank you for your ideas, your participation, and the support you gave each other today."]}</script><script>'use strict';
const CONTENT=JSON.parse(document.getElementById('workshop-content').textContent);
const {stages,strengths,scripts,initialState}=CONTENT;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROJECT=new URLSearchParams(location.search).get('view')==='projection';
const KEY='agile-sprint-offline-v1',DBNAME=KEY+'-'+location.pathname;
let state={...initialState,title:'IAF · Agile Sprint Lab',view:'run',projectionGallery:false},photos=[],filter='all',popup=null,channel=null,db=null,saving=Promise.resolve(),storeAvailable=false;
const app=$('#app'),modal=$('#modal');
const clock=n=>{n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
const remaining=()=>state.running&&state.end?Math.min(state.remaining,Math.max(0,Math.ceil((state.end-Date.now())/1000))):state.remaining;
function notify(text){$('#notice').textContent=text;clearTimeout(notify.timeout);notify.timeout=setTimeout(()=>$('#notice').textContent='',6500);}
function validateState(s){return s&&Number.isInteger(s.stage)&&s.stage>=0&&s.stage<13&&Number.isFinite(s.remaining)&&s.remaining>=0&&s.remaining<=86400&&Number.isInteger(s.teamCount)&&s.teamCount>=1&&s.teamCount<=20&&(s.end===null||Number.isFinite(s.end))&&(s.started===null||Number.isFinite(s.started));}
function normalState(s){return {...initialState,title:String(s.title||'Agile Sprint Lab').slice(0,100),view:s.view==='gallery'?'gallery':'run',projectionGallery:!!s.projectionGallery,stage:s.stage,slide:Math.min(2,Math.max(0,Number(s.slide)||0)),remaining:s.remaining,running:!!s.running,end:s.end,started:s.started,teamCount:s.teamCount,hostName:String(s.hostName||'Percy Hsu').slice(0,80),showChinese:!!s.showChinese};}
async function openStore(){try{db=await new Promise((resolve,reject)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('records');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);setTimeout(()=>reject(Error('Storage unavailable')),1800);});storeAvailable=true;return await new Promise((resolve,reject)=>{const r=db.transaction('records').objectStore('records').get('workshop');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}catch{try{return JSON.parse(localStorage.getItem(KEY+'-backup')||'null');}catch{return null;}}}
function localState(){try{localStorage.setItem(KEY+'-state',JSON.stringify(state));}catch{}}
function persist(){localState();const record={state:{...state},photos:[...photos]};saving=saving.catch(()=>{}).then(()=>db?new Promise((resolve,reject)=>{const t=db.transaction('records','readwrite');t.objectStore('records').put(record,'workshop');t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);}):new Promise((resolve,reject)=>{try{localStorage.setItem(KEY+'-backup',JSON.stringify(record));storeAvailable=true;resolve();}catch(e){reject(e);}}));saving.catch(()=>notify('Changes are in memory only. Use Save backup before closing this page.'));return saving;}
function snapshot(){return {type:'agile-local-snapshot',state,photos};}
function broadcast(){const value=snapshot();try{if(popup&&!popup.closed)popup.postMessage(value,'*');channel?.postMessage(value);}catch{}}
function change(patch){state={...state,...patch};persist();broadcast();render();}
function chooseStage(i){if(i===state.stage&&state.view==='run'){if(state.projectionGallery)change({projectionGallery:false});return;}change({stage:i,slide:0,view:'run',projectionGallery:false,running:false,end:null,remaining:stages[i].minutes*60});}

function adjust(n){const t=Math.max(0,remaining()+n);change({remaining:t,end:state.running?Date.now()+t*1000:null});}
function quickTimer(n){change({remaining:n,running:true,end:Date.now()+n*1000,started:state.started||Date.now()});}

 app.innerHTML='<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">a<span>•</span></span><div>agile sprint lab<small>OFFLINE FACILITATOR WORKSPACE</small></div></div><div class="session-label"><span class="eyebrow">CURRENT WORKSHOP</span><strong>'+esc(state.title)+'</strong><span>120 min · '+state.teamCount+' teams · local</span></div><div class="side-heading">THE RUNDOWN <span>120 MIN</span></div><nav>'+stages.map((s,i)=>'<button data-action="stage" data-index="'+i+'" class="'+(state.view==='run'&&state.stage===i?'active':'')+'"><span class="nav-num">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(s.label)+'</span><small>'+s.minutes+'m</small></button>').join('')+'</nav><button class="gallery-nav" data-action="gallery">▦ Poster gallery <span>'+photos.length+'</span></button><div class="sidebar-foot"><span class="avatar">'+esc(state.hostName[0])+'</span><div>'+esc(state.hostName)+'<small>Workshop facilitator</small></div><button data-action="settings" aria-label="Workshop settings">⚙</button></div></aside><div class="main-shell"><header class="topbar"><div><span class="live-dot"></span><span class="local-name">'+esc(state.title)+'</span><span class="local-tag">OFFLINE · NO LOGIN</span></div><div><button class="secondary" data-action="settings">Settings</button><button class="secondary" data-action="backup">Save backup ↓</button><button class="primary" data-action="project">Open projection ↗</button></div></header>'+(state.view==='gallery'?'<div class="gallery-toolbar"><button class="primary" data-action="project-gallery">Project gallery ↗</button><button class="secondary" data-action="import">Import photos ＋</button><button class="secondary" data-action="export-gallery" '+(!photos.length?'disabled':'')+'>Export gallery ↓</button><button class="secondary" data-action="restore">Restore backup</button></div><p class="local-message">Photos are stored on this computer’s browser. Use Save backup to keep a portable copy. No remote u function updateClocks(){const n=remaining();document.querySelectorAll('[data-timer]').forEach(e=>{e.textContent=clock(n);e.classList.toggle('timer-urgent',n<180);});const progress=$('#timer-progress');if(progress)progress.style.width=Math.max(0,Math.min(100,(stages[state.stage].minutes*60-n)/(stages[state.stage].minutes*60)*100))+'%';const overall=$('#overall-clock');if(overall){if(!state.started)overall.textContent='The 120-minute workshop clock begins with the first timer.';else{const elapsed=Math.max(0,Math.floor((Date.now()-state.started)/1000)),budget=7200-elapsed,needed=n+stages.slice(state.stage+1).reduce((a,s)=>a+s.minutes*60,0),delta=Math.round((needed-budget)/60);overall.innerHTML='Workshop elapsed <b>'+clock(elapsed)+'</b><br>Time to original finish <b>'+clock(budget)+'</b><br>'+(delta>0?delta+' min beyond original finish':Math.abs(delta)+' min ahead of original finish');}}}
function openProjection(gallery=state.projectionGallery){change({projectionGallery:gallery});const u=new URL(location.href);u.search='?view=projection';u.hash='';popup=window.open(u.href,'agile-sprint-local-projection');if(!popup){notify('Allow pop-up windows for this file, then choose Open projection again.');return;}setTimeout(broadcast,150);setTimeout(broadcast,800);}

function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function backup(){download(new Blob([JSON.stringify({format:'agile-sprint-local',version:1,exported:new Date().toISOString(),state,photos})],{type:'application/json'}),'Agile-Sprint-Lab-Backup.json');notify('Backup download requested. Keep it with your HTML file.');}
async function restoreFile(file){try{if(!file||file.size>100*1024*1024)throw Error('Choose a backup under 100 MB.');const data=JSON.parse(await file.text());if(data.format!=='agile-sprint-local'||data.version!==1||!validateState(data.state)||!Array.isArray(data.photos))throw Error('This is not a valid workshop backup.');const ids=new Set();for(const p of data.photos){if(!p||typeof p.id!=='string'||!/^[A-Za-z0-9-]{1,100}$/.test(p.id)||ids.has(p.id)||typeof p.title!=='string'||!p.title.trim()||p.title.length>160||!Number.isInteger(p.team)||p.team<1||p.team>data.state.teamCount||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.src)||!['complete','wip'].includes(p.status))throw Error('The backup contains an invalid poster.');ids.add(p.id);}optionsModal('Restore this workshop?','<p>This replaces the current browser’s workshop and '+photos.length+' photos with the selected backup. Save your current backup first if you want to keep it.</p><div class="confirm-row"><button class="secondary" data-action="backup">Save current backup</button><button class="primary" id="confirm-restore">Restore selected backup</button></div>');$('#confirm-restore').onclick=async()=>{state=normalState(data.state);photos=data.photos;filter='all';await persist().catch(()=>{});modal.innerHTML='';broadcast();render();notify('Workshop restored.');};}catch(e){notify(e.message);}}
function chooseFile(accept,multiple,callback){const input=document.createElement('input');input.type='file';input.accept=accept;input.multiple=multiple;input.hidden=true;document.body.append(input);input.onchange=()=>{callback(multiple?[...input.files]:input.files[0]);input.remove();};input.oncancel=()=>input.remove();input.click();}
async function imageData(file){if(file.size>30*1024*1024)throw Error('Please select photos under 30 MB each.');if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('Use JPG, PNG or WebP. Convert HEIC photos first.');return new Promise((resolve,reject)=>{const img=new Image,u=URL.createObjectURL(file);img.onload=()=>{const factor=Math.min(1,2600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*factor);c.height=Math.round(img.height*factor);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.9));};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error('Could not read this photo.'));};img.src=u;});}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,i=Number(b.dataset.index);if(a==='close'){modal.innerHTML='';importQueue=[];pendingPhoto=null;return;}if(a==='zoom'){zoomPhoto(b.dataset.id);return;}if(a==='fullscreen'){document.documentElement.requestFullscreen?.().catch(()=>notify('Use the browser’s fullscreen command.'));return;}if(PROJECT)return;
 if(a==='stage'&&i>=0&&i<13)chooseStage(i);else if(a==='gallery')change({view:'gallery'});else if(a==='project')openProjection();else if(a==='project-gallery')openProjection(true);else if(a==='slide')change({slide:i});else if(a==='silent'){state.slide=1;quickTimer(180);}else if(a==='quick')quickTimer(Number(b.dataset.seconds));else if(a==='toggle-timer')timerToggle();else if(a==='reset-timer')change({running:false,end:null,remaining:stages[state.stage].minutes*60});else if(a==='adjust')adjust(Number(b.dataset.seconds));else if(a==='settings')settings();else if(a==='backup')backup();else if(a==='restore')chooseFile('.json,application/json',false,restoreFile);else if(a==='import')chooseFile('image/jpeg,image/png,image/webp',true,files=>{importQueue=files;importNext();});else if(a==='edit'){const p=photos.find(p=>p.id===b.dataset.id);if(p)editPhoto(p);}else if(a==='remove'){const id=b.dataset.id;optionsModal('Remove this local photo?','<p>Only this browser’s imported copy will be removed. The original image file on your computer stays unchanged.</p><div class="confirm-row"><button class="secondary" data-action="close">Cancel</button><button class="primary" id="confirm-remove">Remove photo</button></div>');$('#confirm-remove').onclick=()=>{photos=photos.filter(p=>p.id!==id);persist();broadcast();render();modal.innerHTML='';};}else if(a==='export-gallery')galleryExport();else if(a==='print-script')printScript();else if(a==='restart'){optionsModal('Restart rehearsal timers?','<p>Return to the opening and reset the workshop clock. Your photos, name and settings will stay.</p><div class="confirm-row"><button class="secondary" data-action="close">Cancel</button><button class="primary" id="confirm-restart">Restart timers</button></div>');$('#confirm-restart').onclick=()=>{modal.innerHTML='';change({stage:0,slide:0,view:'run',projectionGallery:false,running:false,end:null,remaining:420,started:null});};}});
