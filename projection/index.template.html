<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Agile Sprint Lab: offline bilingual workshop projection with a floating timer.">
<meta name="color-scheme" content="light">
<title>Agile Sprint Lab · Projection</title>
<style>/* INLINE_CSS */</style>
</head>
<body>
<main id="viewport" aria-label="Workshop projection">
  <div id="frame" class="frame">
    <article id="slide" class="canvas"></article>
    <div id="card-modal" class="card-modal" hidden role="dialog" aria-modal="true" aria-label="Card full screen view"></div>
    <aside id="timer" class="timer" aria-label="Timer"></aside>
    <nav class="pager" aria-label="Pages">
      <button class="pager-btn" data-cmd="prev-page" aria-label="Previous page">‹</button>
      <span class="page-number" id="page-number"></span>
      <button class="pager-btn" data-cmd="next-page" aria-label="Next page">›</button>
    </nav>
  </div>
</main>
<div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<script id="config-data" type="application/json">/* INLINE_CONFIG */</script>
<script id="slide-data" type="application/json">/* INLINE_DATA */</script>
<script type="module">/* INLINE_APP */</script>
</body></html>
